# kind cluster: 1 control plane + 2 workers
# Create:  kind create cluster --name lab --config cluster/kind-config.yaml
# Delete:  kind delete cluster --name lab
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Used later when we add an ingress controller (http://localhost:8080)
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
