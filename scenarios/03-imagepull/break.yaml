# Try not to read this file before you troubleshoot!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpne
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: frontend-nginx
