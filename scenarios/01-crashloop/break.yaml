# Try not to read this file before you troubleshoot!
# API service (podinfo - a small Go app built for Kubernetes demos)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command: ["./podinfo"]
          args:
            - --port=9898
            - --cache-server=tcp://redis:6379
            - --level=info
            - --cache-ttl-seconds=300
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9898 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
