# BREAK SCENARIO: oomkilled
# Apply:  make break S=<num>   |   Undo:  make reset
# Try not to read this file before you troubleshoot!
# A new "report-worker" was deployed by the dev team last night...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: demo
  labels: { app: report-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: report-worker }
  template:
    metadata:
      labels: { app: report-worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo 'building monthly report...'; sleep 10; tail /dev/zero"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
